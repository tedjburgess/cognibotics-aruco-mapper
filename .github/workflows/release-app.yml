name: Release app

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e. g.: 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        id: build
        working-directory: app
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="${{ inputs.version }}"; fi
          test -n "$KEYSTORE" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          if [ -n "$API_BASE_URL" ]; then
            ./gradlew assembleRelease -PversionName="$version" -PapiBaseUrl="$API_BASE_URL"
          else
            ./gradlew assembleRelease -PversionName="$version"
          fi
          cp app/build/outputs/apk/release/app-release.apk "../aruco-mapper-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.build.outputs.version }}
          name: Android ${{ steps.build.outputs.version }}
          files: aruco-mapper-*.apk
          draft: true
          generate_release_notes: true
